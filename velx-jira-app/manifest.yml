# Velx prototype: Jira issue-view modules that link Jira issues to Velx (app-scanner) initiatives.
#
#   - Issue Action   "Link to Velx initiative"  -> link the issue to an existing initiative, change or remove the link
#   - Issue Action   "Create Velx initiative"   -> create an initiative from the issue and link it
#   - Issue Context  "Velx initiative"          -> status and current step of the linked initiative
#   - Issue Panel    "Velx initiative"          -> full detail: steps, repositories, goal (+ stub-only simulate buttons)
#   - Issue Activity "Velx journal"             -> the initiative's Velx journal plus what the connector did
#
# Every module talks to the Velx connector (../velx-backend, a stub of Velx) through Forge Remote:
#   UI module --resolver.endpoint--> endpoint "velx-endpoint" --remote--> remotes "velx-connector"
#
# The link is stored as the issue property "velx-initiative". The context, panel and activity
# modules show up only on issues that have it.
#
# The UI uses manual packaging: `bun run build` bundles src/frontend/*.html into build/,
# and `forge deploy` uploads build/ as-is. Always rebuild before deploying.

modules:
  jira:issueAction:
    - key: link-velx-initiative
      resource: frontend/link-velx-initiative
      render: native
      resolver:
        endpoint: velx-endpoint
      title: Link to Velx initiative
      displayConditions:
        hasIssuePermission: EDIT_ISSUES

    - key: create-velx-initiative
      resource: frontend/create-velx-initiative
      render: native
      resolver:
        endpoint: velx-endpoint
      title: Create Velx initiative
      displayConditions:
        hasIssuePermission: EDIT_ISSUES

  jira:issueContext:
    - key: velx-initiative-status
      resource: frontend/velx-initiative-status
      render: native
      resolver:
        endpoint: velx-endpoint
      title: Velx initiative
      label: Velx
      displayConditions:
        entityPropertyExists:
          entity: issue
          propertyKey: velx-initiative

  jira:issuePanel:
    - key: velx-initiative-panel
      resource: frontend/velx-initiative-panel
      render: native
      resolver:
        endpoint: velx-endpoint
      title: Velx initiative
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      displayConditions:
        entityPropertyExists:
          entity: issue
          propertyKey: velx-initiative

  jira:issueActivity:
    - key: velx-journal
      resource: frontend/velx-journal
      render: native
      resolver:
        endpoint: velx-endpoint
      title: Velx journal
      displayConditions:
        entityPropertyExists:
          entity: issue
          propertyKey: velx-initiative

  # Forge Remote endpoint shared by every module.
  # appUserToken makes Forge send an `x-forge-oauth-user` header so the connector can read the
  # issue and read or write its velx-initiative property with the permissions of the user who clicked.
  endpoint:
    - key: velx-endpoint
      remote: velx-connector
      auth:
        appUserToken:
          enabled: true

resources:
  # One UI Kit resource with one entry per module (modules use `resource: frontend/<entry>`).
  # Manual packaging (preview): Forge uploads build/ without compiling or bundling it.
  # Each entry is an HTML file in build/ that Bun produced from src/frontend/<entry>.html.
  - key: frontend
    bundler: manual@2026
    path: build
    entry:
      link-velx-initiative: link-velx-initiative.html
      create-velx-initiative: create-velx-initiative.html
      velx-initiative-status: velx-initiative-status.html
      velx-initiative-panel: velx-initiative-panel.html
      velx-journal: velx-journal.html

remotes:
  - key: velx-connector
    # Set per deploy from the shell, e.g. the cloudflared quick-tunnel URL:
    #   $env:VELX_CONNECTOR_URL = "https://<random>.trycloudflare.com"; bun run deploy
    # Changing this URL creates a new major version of the app.
    baseUrl: ${VELX_CONNECTOR_URL}
    operations:
      - compute # required for invokeRemote
      - storage # the connector sends issue titles and descriptions to Velx
    storage:
      inScopeEUD: true

permissions:
  scopes:
    - read:jira-work # read the issue (summary, description, status) as the user
    - write:jira-work # write and delete the velx-initiative issue property as the user
    - read:app-user-token # lets Forge send the user token to the connector

environment:
  variables:
    - key: VELX_CONNECTOR_URL
      default: https://velx-connector.example.com

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/74d26b02-8e17-4696-b688-936149961083
